# Render.com Blueprint — zero-CLI deploy for the ffmpeg stitcher.
# In Render: New + → Blueprint → connect this GitHub repo → Apply.
# Render builds the Dockerfile remotely and hosts the service.
services:
  - type: web
    name: dreyv-video-stitcher
    runtime: docker
    plan: standard            # 2 GB RAM / 1 CPU — enough for 1080p ffmpeg
    region: oregon
    rootDir: workers/video-stitcher
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: STITCHER_SECRET
        sync: false           # set in Render dashboard
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE
        sync: false
