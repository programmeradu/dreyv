name: Deploy Video Stitcher (Cloudflare Container Worker)

# Builds the ffmpeg container image on GitHub's runners (no local Docker needed)
# and deploys to Cloudflare via wrangler. Triggers on changes to the worker
# package, or manually via the Actions tab.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN     - token with Workers Scripts:Edit + Account:Containers:Edit
#   CLOUDFLARE_ACCOUNT_ID    - your CF account id
#   STITCHER_SECRET          - bearer the Vercel app sends (matches VIDEO_STITCHER_SECRET)
#   R2_ACCOUNT_ID
#   R2_BUCKET
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_PUBLIC_BASE           - public base URL for stitched output (optional, can be empty)

on:
  push:
    branches: [main]
    paths:
      - "workers/video-stitcher/**"
      - ".github/workflows/deploy-video-stitcher.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/video-stitcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: workers/video-stitcher/package-lock.json

      - name: Install deps
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push container secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          put() {
            echo "$2" | npx wrangler secret put "$1"
          }
          put STITCHER_SECRET       "${{ secrets.STITCHER_SECRET }}"
          put R2_ACCOUNT_ID         "${{ secrets.R2_ACCOUNT_ID }}"
          put R2_BUCKET             "${{ secrets.R2_BUCKET }}"
          put R2_ACCESS_KEY_ID      "${{ secrets.R2_ACCESS_KEY_ID }}"
          put R2_SECRET_ACCESS_KEY  "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          put R2_PUBLIC_BASE        "${{ secrets.R2_PUBLIC_BASE }}"

      - name: Deploy Worker + Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
