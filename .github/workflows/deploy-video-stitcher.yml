name: Deploy Video Stitcher (Cloudflare Worker)

# Plain Worker — no Docker, no Container. The ffmpeg host lives on Fly.io
# (see workers/video-stitcher/DEPLOY.md) and the Worker just proxies to it.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN     - token with Workers Scripts:Edit
#   CLOUDFLARE_ACCOUNT_ID    - your CF account id
#   STITCHER_SECRET          - shared bearer (matches VIDEO_STITCHER_SECRET on Vercel and Fly)
#   FFMPEG_HOST_URL          - Fly app URL, e.g. https://dreyv-video-stitcher.fly.dev

on:
  push:
    branches: [main]
    paths:
      - "workers/video-stitcher/src/**"
      - "workers/video-stitcher/wrangler.toml"
      - "workers/video-stitcher/package.json"
      - ".github/workflows/deploy-video-stitcher.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/video-stitcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm install

      - name: Push Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STITCHER_SECRET: ${{ secrets.STITCHER_SECRET }}
          FFMPEG_HOST_URL: ${{ secrets.FFMPEG_HOST_URL }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN repo secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repo secret}"
          : "${STITCHER_SECRET:?Missing STITCHER_SECRET repo secret}"
          : "${FFMPEG_HOST_URL:?Missing FFMPEG_HOST_URL repo secret}"
          printf '%s' "$STITCHER_SECRET" | npx wrangler secret put STITCHER_SECRET
          printf '%s' "$FFMPEG_HOST_URL" | npx wrangler secret put FFMPEG_HOST_URL

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN repo secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID repo secret}"
          npx wrangler deploy
