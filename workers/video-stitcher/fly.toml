# Fly.io app for the ffmpeg stitcher container.
# Deploy with: cd workers/video-stitcher && flyctl launch --copy-config --no-deploy
#              flyctl secrets set STITCHER_SECRET=... R2_ACCOUNT_ID=... R2_BUCKET=... \
#                                 R2_ACCESS_KEY_ID=... R2_SECRET_ACCESS_KEY=... R2_PUBLIC_BASE=...
#              flyctl deploy --remote-only      # builds the Dockerfile on Fly's builder, no local Docker
app = "dreyv-video-stitcher"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
