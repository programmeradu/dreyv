name = "dreyv-video-stitcher"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Plain Worker (no Container, no Docker). Forwards /stitch to the Fly-hosted
# ffmpeg server defined by the FFMPEG_HOST_URL secret.

[observability.logs]
enabled = true

# Secrets (set via `wrangler secret put <NAME>`):
#   STITCHER_SECRET   — shared bearer with Vercel (matches VIDEO_STITCHER_SECRET there)
#   FFMPEG_HOST_URL   — Fly app URL, e.g. https://dreyv-video-stitcher.fly.dev
